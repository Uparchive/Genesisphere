<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#010208"><title>Genesisphere</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#010208;color:#e8eefc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
#game{position:fixed;inset:0;overflow:hidden;background:#010208}#universe{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}#universe:active{cursor:grabbing}.hud{position:absolute;z-index:5;pointer-events:none;background:#050a12b8;border:1px solid #ffffff24;border-radius:10px;padding:10px 13px;backdrop-filter:blur(8px);font-size:12px}.brand{left:16px;top:14px;letter-spacing:4px;font-weight:700}.info{right:16px;top:14px;min-width:160px}.info b{font-size:14px}.info span{display:block;color:#a9b6cd;margin-top:3px}.zoom{left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:7px;pointer-events:auto;align-items:center}.zoom button{width:40px;height:40px;border:1px solid #ffffff2b;border-radius:9px;background:#08101ddd;color:#e8eefc;font-size:20px}.zoom output{min-width:54px;text-align:center;color:#b9c8e8}
#rotate{display:none;position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 35%,#0b1730 0,#030711 48%,#000 100%);align-items:center;justify-content:center;text-align:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
.rotate-card{max-width:340px}.phone{width:42px;height:70px;border:2px solid #b9c8e8;border-radius:8px;margin:0 auto 20px;transform:rotate(90deg);opacity:.9}.rotate-card h1{font-size:20px;margin-bottom:8px}.rotate-card p{font-size:14px;line-height:1.45;color:#9cabc8}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}#game{visibility:hidden}}
@media (orientation:landscape){#game{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}}
</style></head><body>
<main id="game"><canvas id="universe" aria-label="Sistema Genesis com uma estrela e um planeta terrestre"></canvas><div class="hud brand">GENESISPHERE</div><div class="hud info"><b>Sistema Genesis</b><span>Genesis-1 · Estrela G</span><span>Astra-1 · Planeta terrestre</span><span>1,00 UA · 365 dias</span></div><div class="hud zoom"><button id="zoomOut" type="button" aria-label="Afastar">−</button><output id="zoomLevel">1.0×</output><button id="zoomIn" type="button" aria-label="Aproximar">+</button></div></main>
<section id="rotate" role="status" aria-live="polite"><div class="rotate-card"><div class="phone" aria-hidden="true"></div><h1>Explore em modo paisagem</h1><p>Gire seu dispositivo para entrar no Genesisphere e aproveitar toda a extensão do universo.</p></div></section>
<script>
(()=>{const c=document.getElementById("universe"),x=c.getContext("2d");let w=0,h=0,d=1,s=[],ox=0,oy=0,drag=false,lx=0,ly=0,zoom=1,pinch=0;const zi=document.getElementById("zoomIn"),zo=document.getElementById("zoomOut"),zl=document.getElementById("zoomLevel"),pts=new Map();function setZoom(v){zoom=Math.max(.55,Math.min(8,v));zl.value=zoom.toFixed(1)+"×"}
function seed(){s=[];for(let i=0,n=Math.min(1800,Math.floor(w*h/850));i<n;i++){let z=Math.random();s.push({x:Math.random()*w,y:Math.random()*h,r:.25+Math.random()*1.15*(.35+z),a:.18+Math.random()*.78,z:.15+z*.85,t:Math.random()*6.28})}}
function resize(){const r=c.getBoundingClientRect();d=Math.min(devicePixelRatio||1,2);w=Math.max(1,r.width);h=Math.max(1,r.height);c.width=Math.floor(w*d);c.height=Math.floor(h*d);x.setTransform(d,0,0,d,0,0);seed()}
function draw(ms){let g=x.createRadialGradient(w*.5,h*.45,0,w*.5,h*.45,Math.max(w,h)*.75);g.addColorStop(0,"#071022");g.addColorStop(.48,"#020711");g.addColorStop(1,"#000104");x.fillStyle=g;x.fillRect(0,0,w,h);for(const a of s){let px=(a.x+ox*a.z)%w,py=(a.y+oy*a.z)%h;if(px<0)px+=w;if(py<0)py+=h;x.beginPath();x.arc(px,py,a.r,0,Math.PI*2);x.fillStyle="rgba(205,222,255,"+(a.a*(.78+.22*Math.sin(ms*.0015+a.t)))+")";x.fill()}
const cx=w*.48+ox,cy=h*.52+oy,rx=Math.min(w*.34,h*.62)*zoom,ry=rx*.48;
x.save();x.translate(cx,cy);x.strokeStyle="rgba(180,200,230,.3)";x.lineWidth=1;x.setLineDash([5,6]);x.beginPath();x.ellipse(0,0,rx,ry,0,0,Math.PI*2);x.stroke();x.setLineDash([]);
const sg=x.createRadialGradient(0,0,2,0,0,Math.max(18,h*.095)*zoom*zoom);sg.addColorStop(0,"#fffbd0");sg.addColorStop(.25,"#ffd84c");sg.addColorStop(.65,"#ff8a12");sg.addColorStop(1,"rgba(255,100,0,0)");x.fillStyle=sg;x.beginPath();x.arc(0,0,Math.max(18,h*.095),0,Math.PI*2);x.fill();x.fillStyle="#ffd34d";x.beginPath();x.arc(0,0,Math.max(10,h*.052)*zoom,0,Math.PI*2);x.fill();
const ang=ms*.00004,px=Math.cos(ang)*rx,py=Math.sin(ang)*ry,pr=Math.max(5,h*.018)*Math.min(zoom,4);const pg=x.createRadialGradient(px-pr*.3,py-pr*.35,1,px,py,pr);pg.addColorStop(0,"#d9f4ff");pg.addColorStop(.25,"#4e9fd0");pg.addColorStop(.55,"#246f51");pg.addColorStop(1,"#082b55");x.fillStyle=pg;x.beginPath();x.arc(px,py,pr,0,Math.PI*2);x.fill();x.strokeStyle="rgba(120,190,255,.5)";x.stroke();x.restore();requestAnimationFrame(draw)}
c.addEventListener("wheel",e=>{e.preventDefault();setZoom(zoom*(e.deltaY<0?1.12:.89))},{passive:false});
zi.addEventListener("click",()=>setZoom(zoom*1.25));zo.addEventListener("click",()=>setZoom(zoom/1.25));
c.addEventListener("pointerdown",e=>{pts.set(e.pointerId,{x:e.clientX,y:e.clientY});drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId);if(pts.size===2){const p=[...pts.values()];pinch=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y)}});
c.addEventListener("pointermove",e=>{if(!pts.has(e.pointerId))return;pts.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pts.size===2){const p=[...pts.values()],nd=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);if(pinch)setZoom(zoom*nd/pinch);pinch=nd;return}if(drag){ox+=e.clientX-lx;oy+=e.clientY-ly;lx=e.clientX;ly=e.clientY}});
function end(e){pts.delete(e.pointerId);drag=pts.size===1;pinch=0;if(drag){const p=[...pts.values()][0];lx=p.x;ly=p.y}}c.addEventListener("pointerup",end);c.addEventListener("pointercancel",end);
addEventListener("resize",resize);addEventListener("orientationchange",()=>setTimeout(resize,150));resize();requestAnimationFrame(draw)})();
</script><script type="module" src="./src/app.js"></script></body></html>
