<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Genesisphere</title><style>*{box-sizing:border-box;margin:0;padding:0}html,body,#game{width:100%;height:100%;overflow:hidden;background:#010208;color:#e8eefc;font-family:system-ui,sans-serif}#game{position:fixed;inset:0}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.hud{position:absolute;z-index:5;background:#050a12ca;border:1px solid #ffffff25;border-radius:11px;padding:10px 13px;backdrop-filter:blur(10px);font-size:12px}.brand{left:16px;top:14px;letter-spacing:4px;font-weight:700}.info{right:16px;top:14px;min-width:175px}.info b{font-size:14px}.info span{display:block;color:#a9b6cd;margin-top:3px}.zoom{left:50%;bottom:12px;transform:translateX(-50%);display:flex;gap:7px;align-items:center}.zoom button,.back button,.actions button{border:1px solid #ffffff2b;border-radius:9px;background:#08101ddd;color:#e8eefc;padding:9px 12px;font:inherit}.zoom button{width:40px;height:40px;font-size:20px}.zoom output{min-width:54px;text-align:center}.back{left:16px;bottom:12px}.powers{right:16px;bottom:12px}.powers button{border:1px solid #67b9ff73;border-radius:10px;background:#0b1930e8;color:#e8eefc;padding:11px 14px;font-weight:700;letter-spacing:.8px}.powers button:disabled{opacity:.4}.panel{position:absolute;z-index:7;right:16px;bottom:62px;width:min(390px,calc(100vw - 32px));max-height:58vh;overflow:auto;background:#07101ded;border:1px solid #8cc8ff3b;border-radius:14px;padding:12px;backdrop-filter:blur(14px)}.panel[hidden],.hint[hidden]{display:none}.panel h2{font-size:13px;letter-spacing:1.2px;margin:2px 2px 11px}.power-list,.template-list{display:grid;gap:8px}.power-list{grid-template-columns:repeat(3,1fr)}.template-list{grid-template-columns:repeat(3,1fr)}.card{border:1px solid #ffffff1e;background:#0b1727cc;color:#eaf3ff;border-radius:10px;padding:8px;text-align:left;min-height:62px;font:inherit}.card:disabled{opacity:.35}.template{display:flex;flex-direction:column;align-items:center;text-align:center;gap:5px;min-height:104px;font-size:10px}.template img{width:58px;height:58px;object-fit:contain}.hint{position:absolute;z-index:6;left:50%;top:72px;transform:translateX(-50%);text-align:center;background:#081527e8;border:1px solid #74c5ff4a;border-radius:12px;padding:10px 15px;min-width:230px}.hint b{display:block;font-size:13px}.hint span{display:block;margin-top:3px;color:#b8c9df}.actions{display:flex;gap:8px;margin-top:10px}.actions button{flex:1}.confirm{background:#155b45!important;border-color:#5ed4a9!important}.hot{color:#ff966b!important}.ok{color:#72e8ad!important}.cold{color:#8fcaff!important}#rotate{display:none;position:fixed;inset:0;z-index:100;background:#020711;align-items:center;justify-content:center;text-align:center}@media(orientation:portrait) and (max-width:900px){#rotate{display:flex}#game{visibility:hidden}}@media(max-width:640px){.info{display:none}.power-list{grid-template-columns:1fr}.template-list{grid-template-columns:repeat(3,1fr)}} </style></head><body><main id="game"><canvas id="universe"></canvas><div class="hud brand">GENESISPHERE</div><div id="info" class="hud info"></div><div class="hud zoom"><button id="zoomOut">−</button><output id="zoomLevel">1.0×</output><button id="zoomIn">+</button></div><div class="hud back"><button id="back">← Universo</button></div><div class="hud powers"><button id="powers">✦ PODERES</button></div><section id="panel" class="panel" hidden></section><div id="hint" class="hint" hidden></div></main><section id="rotate"><div><h1>Explore em modo paisagem</h1><p>Gire seu dispositivo para criar e observar seu universo.</p></div></section><script type="module">
import{genesis}from'./src/app.js';import{renderAstra1}from'./src/entities/astra-1/render.js';import{PlanetFocusController}from'./src/modules/planet-focus.js';import{classifyOrbit,habitableBandAU}from'./src/systems/stellar/habitability.js';
const c=document.querySelector('#universe'),ctx=c.getContext('2d'),panel=document.querySelector('#panel'),hint=document.querySelector('#hint'),info=document.querySelector('#info'),focus=new PlanetFocusController(),images=new Map();let w=0,h=0,d=1,sky=[],zoom=1,pan={x:0,y:0},mode=null,chosen=null,preview=null,drag=null,moved=false,lastBodies=[],selected=null,viewSystemId=genesis.world.byType('cosmic.star-system')[0].id;for(const t of genesis.templates.all()){const image=new Image();image.src=t.asset;images.set(t.id,image)}const $=x=>document.querySelector(x),all=t=>genesis.world.byType(t),inSystem=t=>all(t).filter(x=>x.systemId===viewSystemId),get=x=>genesis.world.get(x),tpl=x=>genesis.templates.get(x);
function resize(){const r=c.getBoundingClientRect();d=Math.min(devicePixelRatio||1,2);w=r.width;h=r.height;c.width=w*d;c.height=h*d;ctx.setTransform(d,0,0,d,0,0);sky=Array.from({length:Math.min(1000,w*h/1200)},()=>({x:Math.random()*w,y:Math.random()*h,r:.3+Math.random(),a:.15+Math.random()*.7}))}function bg(){const g=ctx.createRadialGradient(w*.5,h*.45,0,w*.5,h*.45,Math.max(w,h)*.75);g.addColorStop(0,'#071022');g.addColorStop(.5,'#020711');g.addColorStop(1,'#000104');ctx.fillStyle=g;ctx.fillRect(0,0,w,h);for(const s of sky){ctx.fillStyle=`rgba(205,222,255,${s.a})`;ctx.beginPath();ctx.arc((s.x+pan.x*.15+w)%w,(s.y+pan.y*.15+h)%h,s.r,0,7);ctx.fill()}}function image(id,x,y,r,fallback){const i=images.get(id);if(i?.complete&&i.naturalWidth)ctx.drawImage(i,x-r,y-r,r*2,r*2);else{ctx.fillStyle=fallback;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}}function hash(id){return[...id].reduce((a,x)=>(a*31+x.charCodeAt())>>>0,0)}function starPos(star){return{x:w*.5+(star.position.x-.5)*w*.46*zoom+pan.x,y:h*.5+(star.position.y-.5)*h*.46*zoom+pan.y}}
function universe(){lastBodies=[];for(const item of all('cosmic.star-system')){const x=item.position.x*w+pan.x,y=item.position.y*h+pan.y,r=item.id===viewSystemId?19:13,g=ctx.createRadialGradient(x,y,2,x,y,r*3);g.addColorStop(0,'#dff5ff');g.addColorStop(.25,'#62baff');g.addColorStop(1,'transparent');ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,r*3,0,7);ctx.fill();ctx.fillStyle='#bfe9ff';ctx.beginPath();ctx.arc(x,y,6,0,7);ctx.fill();ctx.fillStyle='#cbd9eb';ctx.font='11px system-ui';ctx.fillText(item.name,x+r+6,y+3);lastBodies.push({item,x,y,r})}if(mode==='system'){ctx.strokeStyle='#74c5ff';ctx.setLineDash([5,6]);ctx.beginPath();ctx.arc(preview?.x??w/2,preview?.y??h/2,18,0,7);ctx.stroke();ctx.setLineDash([])}}
function system(ms){const stars=inSystem('cosmic.star'),planets=inSystem('cosmic.terrestrial-planet');lastBodies=[];for(const s of stars){const p=starPos(s),r=Math.max(17,38*zoom);if(mode==='planet'&&preview?.starId===s.id){const band=habitableBandAU(s),scale=125*zoom;ctx.fillStyle='rgba(83,218,159,.09)';ctx.beginPath();ctx.arc(p.x,p.y,band.outer*scale,0,7);ctx.arc(p.x,p.y,band.inner*scale,0,7,true);ctx.fill('evenodd');ctx.strokeStyle='rgba(104,231,166,.45)';ctx.setLineDash([4,6]);for(const n of [band.inner,band.outer]){ctx.beginPath();ctx.arc(p.x,p.y,n*scale,0,7);ctx.stroke()}ctx.setLineDash([])}image(s.templateId,p.x,p.y,r,'#ffd34d');lastBodies.push({item:s,x:p.x,y:p.y,r})}for(const p of planets){const parent=get(p.parentStarId);if(!parent)continue;const base=starPos(parent),distance=p.orbit.semiMajorAxisAU*125*zoom,angle=(hash(p.id)%628)/100;ctx.strokeStyle='rgba(180,205,235,.2)';ctx.setLineDash([4,6]);ctx.beginPath();ctx.arc(base.x,base.y,distance,0,7);ctx.stroke();ctx.setLineDash([]);const x=base.x+Math.cos(angle)*distance,y=base.y+Math.sin(angle)*distance,r=Math.max(7,p.planetKind==='gas-giant'?15:10)*Math.min(zoom,1.6);if(p.entityKey==='astra-1')renderAstra1(ctx,{x,y,r,time:ms,detail:zoom});else image(p.templateId,x,y,r,'#5da6e7');lastBodies.push({item:p,x,y,r})}if(mode==='star'&&preview){ctx.strokeStyle='#7ed3ff';ctx.beginPath();ctx.arc(preview.x,preview.y,25,0,7);ctx.stroke();image(chosen,preview.x,preview.y,22,'#ffd34d')}if(mode==='planet'&&preview){const s=get(preview.starId),p=starPos(s),r=preview.au*125*zoom;ctx.strokeStyle='#8bc9ff';ctx.setLineDash([5,5]);ctx.beginPath();ctx.arc(p.x,p.y,r,0,7);ctx.stroke();ctx.setLineDash([]);image(chosen,p.x+r,p.y,11,'#5da6e7')}}
function details(ms){const r=Math.min(w,h)*.38;if(selected.entityKey==='astra-1')renderAstra1(ctx,{x:w/2,y:h/2,r,time:ms,detail:6});else image(selected.templateId,w/2,h/2,r,'#5da6e7')}function updateInfo(){if(focus.active){info.innerHTML=`<b>${selected.name}</b><span>${selected.environment?.thermalClass||'Mundo canônico'}</span>`}else if(viewSystemId){const a=inSystem('cosmic.star').length,b=inSystem('cosmic.terrestrial-planet').length;info.innerHTML=`<b>${get(viewSystemId).name}</b><span>${a} estrela${a===1?'':'s'} · ${b} planeta${b===1?'':'s'}</span><span>${mode?'Modo de criação ativo':'Explore e molde este sistema'}</span>`}else info.innerHTML='<b>Universo Genesisphere</b><span>Escolha ou crie um sistema estelar</span>'}function draw(ms){bg();if(focus.active)details(ms);else if(viewSystemId)system(ms);else universe();updateInfo();requestAnimationFrame(draw)}
function say(title,body){hint.innerHTML=`<b>${title}</b><span>${body}</span>`;hint.hidden=false}function hide(){hint.hidden=true}function cancel(){mode=null;chosen=null;preview=null;hide();panel.hidden=true}function menu(){if(mode)return;panel.hidden=false;const canStar=!!viewSystemId,canPlanet=inSystem('cosmic.star').length>0;panel.innerHTML=`<h2>PODERES</h2><div class="power-list"><button class="card" data-p="system" ${viewSystemId?'disabled':''}>✦<br>Criar sistema</button><button class="card" data-p="star" ${canStar?'':'disabled'}>☀<br>Criar estrela</button><button class="card" data-p="planet" ${canPlanet?'':'disabled'}>◉<br>Criar planeta</button></div>`;panel.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>choosePower(b.dataset.p))}function choosePower(power){panel.hidden=true;if(power==='system'){mode='system';say('CRIAR SISTEMA','Clique no espaço para posicionar o novo sistema.');return}const category=power==='star'?'star':'planet';panel.hidden=false;panel.innerHTML=`<h2>${power==='star'?'CRIAR ESTRELA':'CRIAR PLANETA'}</h2><div class="template-list">${genesis.templates.all(category).map(t=>`<button class="card template" data-t="${t.id}"><img src="${t.asset}"><span>${t.name}</span></button>`).join('')}</div><div class="actions"><button id="cancel">Cancelar</button></div>`;panel.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{chosen=b.dataset.t;mode=power;if(power==='planet'){const s=inSystem('cosmic.star')[0];preview={starId:s.id,au:1};orbitHint()}else say('POSICIONE A ESTRELA','Clique em uma posição livre dentro do sistema.');panel.hidden=true});$('#cancel').onclick=cancel}function orbitHint(){const env=classifyOrbit(get(preview.starId),preview.au),kind=env.habitabilityPotential?'ok':env.thermalClass.includes('FRIO')?'cold':'hot';hint.innerHTML=`<b>${preview.au.toFixed(2).replace('.',',')} UA</b><span class="${kind}">${env.thermalClass}</span><div class="actions"><button id="cancel">Cancelar</button><button id="confirm" class="confirm">Confirmar órbita</button></div>`;hint.hidden=false;$('#cancel').onclick=cancel;$('#confirm').onclick=makePlanet}
function point(e){const r=c.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}function makeSystem(p){const u=all('cosmic.empty-space')[0],n=all('cosmic.star-system').length+1,item=genesis.usePower('CREATE_SYSTEM',{universeId:u.id,name:`Sistema-${n}`,position:{x:Math.max(.04,Math.min(.96,p.x/w)),y:Math.max(.06,Math.min(.94,p.y/h))},metadata:{createdBy:'player'}});viewSystemId=item.id;cancel()}function makeStar(p){const n=inSystem('cosmic.star').length+1;genesis.usePower('CREATE_STAR',{systemId:viewSystemId,templateId:chosen,name:`${tpl(chosen).name} ${n}`,position:{x:Math.max(.08,Math.min(.92,p.x/w)),y:Math.max(.08,Math.min(.92,p.y/h))}});cancel()}function makePlanet(){const s=get(preview.starId),n=inSystem('cosmic.terrestrial-planet').length+1;genesis.usePower('CREATE_PLANET',{systemId:viewSystemId,parentStarId:s.id,templateId:chosen,name:`${tpl(chosen).name} ${n}`,semiMajorAxisAU:+preview.au.toFixed(2),eccentricity:0,periodDays:+(365.25*Math.sqrt(preview.au**3/(s.massSolar||1))).toFixed(1)});cancel()}function select(p){const hit=[...lastBodies].reverse().find(x=>Math.hypot(p.x-x.x,p.y-x.y)<=Math.max(x.r*1.65,18));if(!hit)return;if(hit.item.type==='cosmic.star-system'){viewSystemId=hit.item.id;pan={x:0,y:0}}else if(hit.item.type==='cosmic.terrestrial-planet'){selected=hit.item;focus.enter(selected);$('#back').textContent='← Sistema'}}
c.onpointerdown=e=>{const p=point(e);drag=p;moved=false;c.setPointerCapture(e.pointerId)};c.onpointermove=e=>{const p=point(e);if(mode==='system'||mode==='star'){preview=p;return}if(mode==='planet'){const s=starPos(get(preview.starId));preview.au=Math.max(.12,Math.min(6,Math.hypot(p.x-s.x,p.y-s.y)/(125*zoom)));orbitHint();return}if(!drag||focus.active)return;if(Math.hypot(p.x-drag.x,p.y-drag.y)>3)moved=true;pan.x+=p.x-drag.x;pan.y+=p.y-drag.y;drag=p};c.onpointerup=e=>{const p=point(e);if(!moved){if(mode==='system')makeSystem(p);else if(mode==='star')makeStar(p);else if(!mode&&!focus.active)select(p)}drag=null};c.onwheel=e=>{if(!mode){e.preventDefault();zoom=Math.max(.55,Math.min(5,zoom*(e.deltaY<0?1.12:.89)));$('#zoomLevel').value=zoom.toFixed(1)+'×'}};$('#zoomIn').onclick=()=>{$('#zoomLevel').value=(zoom=Math.min(5,zoom*1.25)).toFixed(1)+'×'};$('#zoomOut').onclick=()=>{$('#zoomLevel').value=(zoom=Math.max(.55,zoom/1.25)).toFixed(1)+'×'};$('#powers').onclick=menu;$('#back').onclick=()=>{if(focus.active){focus.exit();selected=null;$('#back').textContent='← Universo'}else if(viewSystemId){viewSystemId=null;pan={x:0,y:0}}};addEventListener('resize',resize);resize();requestAnimationFrame(draw);
</script></body></html>
