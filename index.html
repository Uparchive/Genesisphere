<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#010208"><title>Genesisphere</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#010208;color:#e8eefc;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;overscroll-behavior:none}
#game{position:fixed;inset:0;overflow:hidden;background:#010208}#universe{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}#universe:active{cursor:grabbing}
#rotate{display:none;position:fixed;inset:0;z-index:100;background:radial-gradient(circle at 50% 35%,#0b1730 0,#030711 48%,#000 100%);align-items:center;justify-content:center;text-align:center;padding:max(24px,env(safe-area-inset-top)) max(24px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(24px,env(safe-area-inset-left))}
.rotate-card{max-width:340px}.phone{width:42px;height:70px;border:2px solid #b9c8e8;border-radius:8px;margin:0 auto 20px;transform:rotate(90deg);opacity:.9}.rotate-card h1{font-size:20px;margin-bottom:8px}.rotate-card p{font-size:14px;line-height:1.45;color:#9cabc8}
@media (orientation:portrait) and (max-width:900px){#rotate{display:flex}#game{visibility:hidden}}
@media (orientation:landscape){#game{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}}
</style></head><body>
<main id="game"><canvas id="universe" aria-label="Universo vazio de Genesisphere"></canvas></main>
<section id="rotate" role="status" aria-live="polite"><div class="rotate-card"><div class="phone" aria-hidden="true"></div><h1>Explore em modo paisagem</h1><p>Gire seu dispositivo para entrar no Genesisphere e aproveitar toda a extensão do universo.</p></div></section>
<script>
(()=>{const c=document.getElementById("universe"),x=c.getContext("2d");let w=0,h=0,d=1,s=[],ox=0,oy=0,drag=false,lx=0,ly=0;
function seed(){s=[];for(let i=0,n=Math.min(1800,Math.floor(w*h/850));i<n;i++){let z=Math.random();s.push({x:Math.random()*w,y:Math.random()*h,r:.25+Math.random()*1.15*(.35+z),a:.18+Math.random()*.78,z:.15+z*.85,t:Math.random()*6.28})}}
function resize(){const r=c.getBoundingClientRect();d=Math.min(devicePixelRatio||1,2);w=Math.max(1,r.width);h=Math.max(1,r.height);c.width=Math.floor(w*d);c.height=Math.floor(h*d);x.setTransform(d,0,0,d,0,0);seed()}
function draw(ms){let g=x.createRadialGradient(w*.5,h*.45,0,w*.5,h*.45,Math.max(w,h)*.75);g.addColorStop(0,"#071022");g.addColorStop(.48,"#020711");g.addColorStop(1,"#000104");x.fillStyle=g;x.fillRect(0,0,w,h);for(const a of s){let px=(a.x+ox*a.z)%w,py=(a.y+oy*a.z)%h;if(px<0)px+=w;if(py<0)py+=h;x.beginPath();x.arc(px,py,a.r,0,Math.PI*2);x.fillStyle="rgba(205,222,255,"+(a.a*(.78+.22*Math.sin(ms*.0015+a.t)))+")";x.fill()}requestAnimationFrame(draw)}
c.addEventListener("pointerdown",e=>{drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener("pointermove",e=>{if(!drag)return;ox+=e.clientX-lx;oy+=e.clientY-ly;lx=e.clientX;ly=e.clientY});c.addEventListener("pointerup",()=>drag=false);c.addEventListener("pointercancel",()=>drag=false);
addEventListener("resize",resize);addEventListener("orientationchange",()=>setTimeout(resize,150));resize();requestAnimationFrame(draw)})();
</script><script type="module" src="./src/app.js"></script></body></html>
