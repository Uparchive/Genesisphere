<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#010208">
<title>Genesisphere</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#010208}
body{font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#universe{position:fixed;inset:0;width:100%;height:100%;display:block;background:radial-gradient(ellipse at center,#070d1c 0%,#02050d 50%,#000 100%);touch-action:none;cursor:grab}
#universe:active{cursor:grabbing}
</style>
</head>
<body>
<canvas id="universe" aria-label="Universo vazio de Genesisphere"></canvas>
<script>
(()=>{
const c=document.getElementById('universe'),x=c.getContext('2d');
let w=0,h=0,dpr=1,stars=[],ox=0,oy=0,drag=false,lx=0,ly=0;
function seed(){
 stars=[];
 const n=Math.min(1800,Math.floor(w*h/850));
 for(let i=0;i<n;i++){
  const z=Math.random();
  stars.push({x:Math.random()*w,y:Math.random()*h,r:.25+Math.random()*1.15*(.35+z),a:.18+Math.random()*.78,z:.15+z*.85,t:Math.random()*6.28});
 }
}
function resize(){
 dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;
 c.width=Math.floor(w*dpr);c.height=Math.floor(h*dpr);c.style.width=w+'px';c.style.height=h+'px';
 x.setTransform(dpr,0,0,dpr,0,0);seed();
}
function draw(ms){
 x.clearRect(0,0,w,h);
 const g=x.createRadialGradient(w*.5,h*.45,0,w*.5,h*.45,Math.max(w,h)*.75);
 g.addColorStop(0,'#071022');g.addColorStop(.48,'#020711');g.addColorStop(1,'#000104');
 x.fillStyle=g;x.fillRect(0,0,w,h);
 for(const s of stars){
  let px=(s.x+ox*s.z)%w,py=(s.y+oy*s.z)%h;if(px<0)px+=w;if(py<0)py+=h;
  const tw=.78+.22*Math.sin(ms*.0015+s.t);
  x.beginPath();x.arc(px,py,s.r,0,Math.PI*2);x.fillStyle='rgba(205,222,255,'+(s.a*tw)+')';x.fill();
 }
 requestAnimationFrame(draw);
}
c.addEventListener('pointerdown',e=>{drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{if(!drag)return;ox+=e.clientX-lx;oy+=e.clientY-ly;lx=e.clientX;ly=e.clientY});
c.addEventListener('pointerup',()=>drag=false);c.addEventListener('pointercancel',()=>drag=false);
addEventListener('resize',resize);resize();requestAnimationFrame(draw);
})();
</script>
</body>
</html>
