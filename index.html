<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#010208"><title>Genesisphere</title><style>*{box-sizing:border-box;margin:0;padding:0}html,body{width:100%;height:100%;overflow:hidden;background:#010208}#universe{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}</style></head><body><canvas id="universe" aria-label="Universo vazio de Genesisphere"></canvas><script>(()=>{const c=document.getElementById("universe"),x=c.getContext("2d");let w,h,d=1,s=[],ox=0,oy=0,drag=false,lx=0,ly=0;function seed(){s=[];for(let i=0,n=Math.min(1800,Math.floor(w*h/850));i<n;i++){let z=Math.random();s.push({x:Math.random()*w,y:Math.random()*h,r:.25+Math.random()*1.15*(.35+z),a:.18+Math.random()*.78,z:.15+z*.85,t:Math.random()*6.28})}}function resize(){d=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;c.width=w*d;c.height=h*d;x.setTransform(d,0,0,d,0,0);seed()}function draw(ms){let g=x.createRadialGradient(w*.5,h*.45,0,w*.5,h*.45,Math.max(w,h)*.75);g.addColorStop(0,"#071022");g.addColorStop(.48,"#020711");g.addColorStop(1,"#000104");x.fillStyle=g;x.fillRect(0,0,w,h);for(const a of s){let px=(a.x+ox*a.z)%w,py=(a.y+oy*a.z)%h;if(px<0)px+=w;if(py<0)py+=h;x.beginPath();x.arc(px,py,a.r,0,Math.PI*2);x.fillStyle="rgba(205,222,255,"+(a.a*(.78+.22*Math.sin(ms*.0015+a.t)))+")";x.fill()}requestAnimationFrame(draw)}c.addEventListener("pointerdown",e=>{drag=true;lx=e.clientX;ly=e.clientY;c.setPointerCapture(e.pointerId)});c.addEventListener("pointermove",e=>{if(drag){ox+=e.clientX-lx;oy+=e.clientY-ly;lx=e.clientX;ly=e.clientY}});c.addEventListener("pointerup",()=>drag=false);addEventListener("resize",resize);resize();requestAnimationFrame(draw)})();</script><script type="module" src="./src/app.js"></script></body></html>
